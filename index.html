  // Síntese dos instrumentos do sequenciador
  function _kick(t, vol) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(160, t);
    o.frequency.exponentialRampToValueAtTime(40, t+0.15);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.28);
    o.connect(g); g.connect(masterGain);
    o.start(t); o.stop(t+0.30);
  }

  function _snare(t, vol) {
    const bufLen = Math.ceil(ctx.sampleRate * 0.17);
    const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<bufLen;i++) d[i]=Math.random()*2-1;
    const src = ctx.createBufferSource(); src.buffer = buf;
    const bp = ctx.createBiquadFilter();
    bp.type='bandpass'; bp.frequency.setValueAtTime(1800,t); bp.Q.setValueAtTime(0.5,t);
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.17);
    const o = ctx.createOscillator(), g2 = ctx.createGain();
    o.type='triangle'; o.frequency.setValueAtTime(220,t);
    g2.gain.setValueAtTime(vol*0.6, t);
    g2.gain.exponentialRampToValueAtTime(0.0001, t+0.1);
    src.connect(bp); bp.connect(g); g.connect(masterGain);
    o.connect(g2); g2.connect(masterGain);
    src.start(t); src.stop(t+0.18);
    o.start(t); o.stop(t+0.11);
  }

  function _hihat(t, vol, isOpen) {
    const dur = isOpen ? 0.16 : 0.035;
    const bufLen = Math.ceil(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<bufLen;i++) d[i]=Math.random()*2-1;
    const src = ctx.createBufferSource(); src.buffer = buf;
    const hp = ctx.createBiquadFilter();
    hp.type='highpass'; hp.frequency.setValueAtTime(9000,t);
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    src.connect(hp); hp.connect(g); g.connect(masterGain);
    src.start(t); src.stop(t+dur+0.01);
  }

  function _bass(t, freq, dur, vol, type) {
    if (!freq) return;
    const o = ctx.createOscillator(), o2 = ctx.createOscillator();
    const g = ctx.createGain(), filt = ctx.createBiquadFilter();
    filt.type='lowpass'; filt.frequency.setValueAtTime(500,t);
    filt.frequency.linearRampToValueAtTime(200, t+dur);
    o.type=type; o.frequency.setValueAtTime(freq,t);
    o2.type='sine'; o2.frequency.setValueAtTime(freq*0.5,t);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vol, t+0.015);
    g.gain.linearRampToValueAtTime(vol*0.65, t+dur*0.7);
    g.gain.linearRampToValueAtTime(0.0001, t+dur);
    o.connect(filt); o2.connect(filt); filt.connect(g); g.connect(masterGain);
    o.start(t); o.stop(t+dur+0.01);
    o2.start(t); o2.stop(t+dur+0.01);
  }

  function _arp(t, freqs, step, vol) {
    freqs.forEach((f,i) => {
      if (!f) return;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type='triangle'; o.frequency.setValueAtTime(f, t+i*step);
      g.gain.setValueAtTime(0.0001, t+i*step);
      g.gain.linearRampToValueAtTime(vol, t+i*step+0.015);
      g.gain.linearRampToValueAtTime(0.0001, t+i*step+step*0.8);
      o.connect(g); g.connect(masterGain);
      o.start(t+i*step); o.stop(t+i*step+step+0.01);
    });
  }

  function _pad(t, chord, barDur, vol) {
    chord.forEach(f => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      const filt = ctx.createBiquadFilter();
      filt.type='lowpass'; filt.frequency.setValueAtTime(700,t);
      o.type='sine'; o.frequency.setValueAtTime(f,t);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.linearRampToValueAtTime(vol, t+0.5);
      g.gain.linearRampToValueAtTime(vol*0.7, t+barDur*0.7);
      g.gain.linearRampToValueAtTime(0.0001, t+barDur-0.05);
      o.connect(filt); filt.connect(g); g.connect(masterGain);
      o.start(t); o.stop(t+barDur);
    });
  }

  // Sequenciador com lookahead via requestAnimationFrame
  function _scheduleBar(t, p) {
    if (!ctx || !enabled) return;
    const step = (60/p.bpm) / 4;   // duração de 1 semicolcheia
    const barDur = step * 16;

    // Padrão de 16 passos
    for (let i=0;i<16;i++) {
      const st = t + i*step;
      if (p.kickPat[i])  _kick(st, p.kickVol);
      if (p.snarePat[i]) _snare(st, p.snareVol);
      if (p.hatPat[i])   _hihat(st, p.hatVol, i===4||i===12);
    }

    // Bass — 16 notas mapeadas nos 16 steps
    const bl = p.bassLines[_barCount % p.bassLines.length];
    bl.forEach((f,i) => { if(f) _bass(t+i*step, f, step*0.85, p.bassVol, p.bassType); });

    // Arp — a cada 2 compassos
    if (_barCount % 2 === 0) {
      const al = p.arpLines[(_barCount/2) % p.arpLines.length];
      _arp(t, al, p.arpStep, p.arpVol);
    }

    // Pad — a cada N compassos
    if (_barCount % p.padEvery === 0) {
      const ch = p.padChords[_barCount % p.padChords.length];
      _pad(t, ch, barDur, 0.028);
    }
  }

  function _musicLoop(rafTime) {
    if (!musicStarted || !gameActive || !enabled) return;

    const track = getTrackParams(level);
    const barDur = (60 / track.bpm) * 4;  // 1 compasso = 4 beats

    // Detecta mudança de trilha e reseta o barCount (sem reiniciar o clock)
    const trackLabel = track.label;
    if (trackLabel !== _lastTrackLevel) {
      _lastTrackLevel = trackLabel;
      _barCount = 0;
      // Transição suave: ajusta nextBarTime para agora + lookAhead
      _nextBarTime = Math.max(_nextBarTime, ctx.currentTime + 0.05);
    }

    // Agenda todos os compassos que caibam dentro da janela de lookahead
    while (_nextBarTime < ctx.currentTime + _scheduleAhead) {
      if (gameActive && enabled) {
        _scheduleBar(_nextBarTime, track);
        _barCount++;
      }
      _nextBarTime += barDur;
    }

    _musicRAF = requestAnimationFrame(_musicLoop);
  }

  function startMusic() {
    if (!ctx || !enabled || musicStarted) return;
    musicStarted = true;
    _barCount = 0;
    _lastTrackLevel = -1;
    _nextBarTime = ctx.currentTime + 0.05;
    _musicRAF = requestAnimationFrame(_musicLoop);
  }

  function stopMusic() {
    musicStarted = false;
    if (_musicRAF) { cancelAnimationFrame(_musicRAF); _musicRAF = null; }
  }

  function suspendMusic() {
    if (!ctx || !enabled) return;
    if (_musicRAF) { cancelAnimationFrame(_musicRAF); _musicRAF = null; }
    // Fade out suave
    if (masterGain) {
      masterGain.gain.cancelScheduledValues(ctx.currentTime);
      masterGain.gain.setValueAtTime(masterGain.gain.value, ctx.currentTime);
      masterGain.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + 0.15);
    }
    setTimeout(() => { if (ctx && ctx.state === 'running') ctx.suspend(); }, 160);
  }

  function resumeMusic() {
    if (!ctx || !enabled || !musicStarted) return;
    if (ctx.state === 'suspended') ctx.resume();
    // Fade in suave
    if (masterGain) {
      masterGain.gain.cancelScheduledValues(ctx.currentTime);
      masterGain.gain.setValueAtTime(0.0001, ctx.currentTime);
      masterGain.gain.linearRampToValueAtTime(0.72, ctx.currentTime + 0.2);
    }
    // Reinicia o loop do sequenciador
    if (!_musicRAF) {
      _nextBarTime = ctx.currentTime + 0.05;
      _musicRAF = requestAnimationFrame(_musicLoop);
    }
  }

  // ── Sons de UI — estilo jewel/puzzle game ───────────────

  // Hover: tique cristalino leve
  function uiHover() {
    if (!ctx || !enabled) return;
    const t = ctx.currentTime;
    osc('sine', 1400, t, 0.055, 0.032);
    osc('triangle', 2100, t + 0.01, 0.025, 0.025);
  }

  // Botão secundário / navegação: "tic" vítreo neon
  function uiClick() {
    if (!ctx || !enabled) return;
    const t = ctx.currentTime;
    // corpo do sino
    osc('sine',     880, t,       0.13,  0.09);
    osc('triangle',1760, t,       0.07,  0.06);
    // shimmer de cristal
    osc('sine',    3520, t + 0.01, 0.04, 0.04);
    // transiente percussivo
    noise(t, 0.025, 0.07, {type:'highpass', freq:5500, Q:0.6});
  }

  // Confirmar / Iniciar: arpejo "gem collected" positivo
  function uiConfirm() {
    if (!ctx || !enabled) return;
    const t = ctx.currentTime;
    [523, 659, 784, 1047].forEach((f, i) => {
      const st = t + i * 0.052;
      osc('sine',     f,       st, 0.14, 0.12);
      osc('triangle', f * 1.5, st, 0.07, 0.06);
    });
    // brilho final
    osc('sine', 2093, t + 0.20, 0.09, 0.16);
    noise(t, 0.04, 0.05, {type:'highpass', freq:4500, Q:0.8});
  }

  // Voltar: tom descendente suave
  function uiBack() {
    if (!ctx || !enabled) return;
    const t = ctx.currentTime;
    oscRamp('sine',     660, 440, t, 0.12, 0.10);
    oscRamp('triangle', 990, 660, t, 0.12, 0.06);
    noise(t, 0.04, 0.04, {type:'bandpass', freq:1200, Q:2});
  }

  // Selecionar item / toggle: "pop" duplo cristalino
  function uiSelect() {
    if (!ctx || !enabled) return;
    const t = ctx.currentTime;
    osc('sine',     1047, t,        0.11, 0.11);
    osc('sine',     1319, t + 0.06, 0.11, 0.13);
    osc('triangle', 2093, t + 0.08, 0.06, 0.09);
    oscRamp('sine', 300, 80, t, 0.04, 0.07);
    noise(t, 0.03, 0.06, {type:'highpass', freq:3500, Q:1});
  }

  // ── API pública ─────────────────────────────────────────
  function play(name, ...args) {
    if (!enabled) return;
    init();
    resume();
    const map = { move, rotate, softDrop, hardDrop: hardDropSfx, lock,
      clearSingle, clearDouble, clearTriple, clearTetris,
      combo, levelUp, hold, gameOver, start: startSfx, gamepadConnect,
      uiHover, uiClick, uiConfirm, uiBack, uiSelect };
    if (map[name]) map[name](...args);
  }

  // Toggle button — hidden (controlled via Options menu)
  function createToggle() {
    const btn = document.createElement('button');
    btn.id = 'sfxToggle';
    btn.style.cssText = 'display:none;';
    btn.onclick = () => {
      enabled = !enabled;
      if (masterGain) masterGain.gain.setValueAtTime(enabled ? 0.72 : 0, ctx.currentTime);
      if (enabled && gameActive && !musicStarted) { init(); resume(); startMusic(); }
    };
    document.body.appendChild(btn);
  }

  return { play, init, resume, startMusic, stopMusic, suspendMusic, resumeMusic, createToggle };
})();

// Inicializa o botão de som

const _origCheckLines = checkLines;
checkLines = function() {
  // Detect cleared lines before calling original
  let cleared = 0;
  for (let r=0; r<ROWS; r++) {
    if (grid[r].every(c=>c!==null)) cleared++;
  }
  if (cleared > 0) {
    if (cleared >= 4) SFX.play('clearTetris');
    else if (cleared === 3) SFX.play('clearTriple');
    else if (cleared === 2) SFX.play('clearDouble');
    else SFX.play('clearSingle');
  }
  _origCheckLines();
};

// ═══════════════════════════════════════════════════════════
// UI SOUND DELEGATION — captura todos os botões, incluindo
// os gerados dinamicamente pelo showOptions / showThemes etc.
// ═══════════════════════════════════════════════════════════
(function() {
  // Desbloqueia AudioContext no primeiro toque/clique/tecla
  function _unlock() { SFX.init(); SFX.resume(); }
  document.addEventListener('pointerdown', _unlock, { once: true });
  document.addEventListener('keydown',     _unlock, { once: true });

  // ── Som ao pressionar qualquer botão de menu ──────────────
  // Usa 'pointerdown' para garantir que o som toca ANTES
  // do onclick nativo do browser (que pode navegar a tela)
  document.addEventListener('pointerdown', function(e) {
    // Garante AudioContext desbloqueado em cada toque
    SFX.init(); SFX.resume();

    const btn = e.target.closest('.btn, .theme-card, #pauseBtn, #holdPanel');
    if (!btn) return;

    // Identifica o tipo de ação pelo conteúdo e classe
    const txt  = (btn.textContent || '').trim().toUpperCase();
    const cls  = btn.className || '';

    if (btn.id === 'pauseBtn' || btn.id === 'holdPanel') {
      SFX.play('uiClick'); return;
    }

    if (btn.classList.contains('theme-card')) {
      SFX.play('uiSelect'); return;
    }

    // Botão de confirmação / início de jogo
    if (cls.includes('btn-primary') ||
        txt.includes('INICIAR') || txt.includes('JOGAR NOVAMENTE') ||
        txt.includes('PLAY') || txt.includes('START')) {
      SFX.play('uiConfirm'); return;
    }

    // Botão de voltar
    if (txt.includes('VOLTAR') || txt.startsWith('←') || txt.includes('← VOLTAR')) {
      SFX.play('uiBack'); return;
    }

    // Qualquer outro botão (opções, fullscreen, temas, etc.)
    SFX.play('uiClick');
  });

  // ── Hover nos botões de menu ──────────────────────────────
  document.addEventListener('mouseover', function(e) {
    const btn = e.target.closest('.btn, .theme-card');
    if (!btn) return;
    // Evita disparar múltiplas vezes enquanto move dentro do botão
    if (btn._sfxHovered) return;
    btn._sfxHovered = true;
    SFX.play('uiHover');
    btn.addEventListener('mouseleave', () => { btn._sfxHovered = false; }, { once: true });
  });

  // ── Teclado: troca som de Enter nos menus de uiClick→uiConfirm ──
  // (patch sobre o listener de keydown já existente no arquivo)
  document.addEventListener('keydown', function(e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const overlay = document.getElementById('overlay');
    if (!overlay || overlay.classList.contains('hidden')) return;
    const focused = overlay.querySelector('.kb-focus');
    if (!focused) return;
    const txt = (focused.textContent || '').trim().toUpperCase();
    const cls = focused.className || '';
    if (cls.includes('btn-primary') || txt.includes('INICIAR') || txt.includes('JOGAR')) {
      SFX.play('uiConfirm');
    } else if (txt.includes('VOLTAR') || txt.startsWith('←')) {
      SFX.play('uiBack');
    } else if (focused.classList.contains('theme-card')) {
      SFX.play('uiSelect');
    } else {
      SFX.play('uiClick');
    }
  });
})();

// ═══════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════
function hexToRgba(hex, alpha) {
  if (!hex || hex[0]!=='#') return `rgba(128,128,128,${alpha})`;
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}
